site_name: Арина Куприянова
site_description: всем привет, на сайте можно прочитать информацию обо мне)))
site_author: Арина

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: light blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share


nav:
  - Главная: index.md
  - О себе: about.md
  - Проекты: projects.md
  - Резюме: resume.md
  - Достижения: achievements.md
  - Контакты: contacts.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html